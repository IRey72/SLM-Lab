name: Build FFXI watch face

on:
  push:
    paths:
      - 'ffxi-watchface/**'
      - '.github/workflows/build-watchface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffxi-watchface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk vanadiel-chronograph.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vanadiel-chronograph-apk
          path: ffxi-watchface/vanadiel-chronograph.apk

      # A release gives a plain download link that's easy to open on a phone.
      - name: Publish to the "watchface-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete watchface-latest --yes --cleanup-tag || true
          gh release create watchface-latest vanadiel-chronograph.apk \
            --target "${{ github.sha }}" \
            --title "Vana'diel Chronograph (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}" \
            --prerelease
